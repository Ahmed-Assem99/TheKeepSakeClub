<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Keepsake Club | Personalized gifts &amp; keepsakes in Egypt</title>
    <meta
      name="description"
      content="for the memories worth keeping. personalized gift bundles and custom keepsake books from The Keepsake Club, an Egypt-based gift shop. order through our Instagram DMs<3"
    />
    <meta name="theme-color" content="#FEB4E3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- %SITE_URL% is filled in at build time (see vite.config.ts): the Vercel domain, or SITE_URL if set -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Keepsake Club" />
    <meta property="og:title" content="The Keepsake Club | Personalized gifts & keepsakes in Egypt" />
    <meta property="og:description" content="for the memories worth keeping. personalized gift bundles and custom keepsake books, ordered through our DMs<3" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Keepsake Club: a red ribbon heart monogram on bubblegum pink" />
    <meta property="og:locale" content="en_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Keepsake Club | Personalized gifts & keepsakes in Egypt" />
    <meta name="twitter:description" content="for the memories worth keeping. order through our DMs<3" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/londrina-solid-900.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-variable.woff2" crossorigin />
    <style>
      /* Pink loading splash, shown only while #root is still empty (dev / no pre-rendered HTML). */
      #root:empty { position: fixed; inset: 0; display: grid; place-items: center; background: #feb4e3; }
      #root:empty::before {
        content: ''; width: 52px; height: 52px; border-radius: 50%;
        border: 5px solid rgba(218, 15, 26, 0.18); border-top-color: #da0f1a;
        animation: ks-spin 0.8s linear infinite;
      }
      @keyframes ks-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #root:empty::before { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; text-align: center">
        The Keepsake Club: for the memories worth keeping. Order through our Instagram DMs:
        <a href="https://ig.me/m/thekeepsakeclubb">@thekeepsakeclubb</a>
      </p>
    </noscript>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
